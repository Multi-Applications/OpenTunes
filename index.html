<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTunes</title>
  <link rel="icon" type="image/webp" href="icon.webp">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="./src/main.ts"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased dark:bg-zinc-950 dark:text-zinc-50">
<header class="sticky top-0 z-40 border-b border-gray-200 bg-gray-50/85 backdrop-blur-xl dark:border-zinc-800 dark:bg-zinc-950/85">
  <div class="mx-auto max-w-[1120px] px-4 sm:px-6">
    <div class="flex flex-wrap items-center gap-3 py-3">
      <div class="flex flex-none select-none items-center">
        <picture>
          <source srcset="icon-white.webp" media="(prefers-color-scheme: dark)">
          <img src="icon-black.webp" alt="OpenTunes" class="h-10 w-auto">
        </picture>
      </div>

      <div class="relative order-3 w-full min-w-0 sm:order-2 sm:w-auto sm:max-w-[480px] sm:flex-1">
        <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400 dark:text-zinc-500"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="q" type="search" autocomplete="off"
               data-i18n-placeholder="search"
               placeholder="Search stations or genres..."
               class="h-[42px] w-full rounded-full border border-gray-200 bg-white pl-10 pr-10 text-sm outline-none transition-colors placeholder:text-gray-400 focus:border-slate-900 dark:border-zinc-800 dark:bg-zinc-900 dark:placeholder:text-zinc-500 dark:focus:border-white">
        <button id="qClear" type="button" aria-label="Clear search"
                class="absolute right-2.5 top-1/2 h-6 w-6 -translate-y-1/2 items-center justify-center rounded-full text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-900 dark:text-zinc-500 dark:hover:bg-zinc-800 dark:hover:text-zinc-50">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <div class="order-2 ml-auto flex flex-none items-center gap-2 sm:order-3">

        <button id="addBtn" type="button"
                data-i18n-title="addStation" data-i18n-aria="addStation"
                title="Add Station" aria-label="Add Station"
                class="flex h-[42px] w-[42px] flex-none items-center justify-center rounded-full bg-slate-900 text-white transition-opacity hover:opacity-90 dark:bg-white dark:text-zinc-950">
          <span class="relative block h-4 w-4" aria-hidden="true">
            <span class="absolute left-1/2 top-0 h-4 w-[2px] -translate-x-1/2 rounded-full bg-current"></span>
            <span class="absolute left-0 top-1/2 h-[2px] w-4 -translate-y-1/2 rounded-full bg-current"></span>
          </span>
        </button>

        <div class="relative flex-none">
          <select id="langSelect" aria-label="Language"
                  class="h-[42px] appearance-none rounded-full border border-gray-200 bg-white pl-3.5 pr-8 text-sm font-bold tracking-wide outline-none transition-colors focus:border-slate-900 dark:border-zinc-800 dark:bg-zinc-900 dark:focus:border-white"></select>
          <svg class="pointer-events-none absolute right-3 top-1/2 h-3 w-3 -translate-y-1/2 text-gray-400 dark:text-zinc-500"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 9l-7 7-7-7"/>
          </svg>
        </div>

      </div>
    </div>

    <nav id="tabs" class="no-scrollbar flex gap-1.5 overflow-x-auto pb-3">
      <button class="tab flex-none rounded-full px-[18px] py-2 text-sm font-medium text-gray-500 transition-colors hover:text-gray-900 dark:text-zinc-400 dark:hover:text-zinc-50"
              data-view="discover" data-i18n="tabDiscover">Discover</button>
      <button class="tab flex-none rounded-full px-[18px] py-2 text-sm font-medium text-gray-500 transition-colors hover:text-gray-900 dark:text-zinc-400 dark:hover:text-zinc-50"
              data-view="favs" data-i18n="tabFavs">Favorites</button>
      <button class="tab flex-none rounded-full px-[18px] py-2 text-sm font-medium text-gray-500 transition-colors hover:text-gray-900 dark:text-zinc-400 dark:hover:text-zinc-50"
              data-view="mine" data-i18n="tabMine">Added Stations</button>
    </nav>

  </div>
</header>

<main class="mx-auto max-w-[1120px] px-4 pb-36 sm:px-6">
  <div id="toolbar" class="no-scrollbar my-6 flex items-center gap-3 overflow-x-auto pb-2"></div>
  <h2 id="sectionTitle" class="my-5 text-xl font-bold tracking-tight">Discover</h2>
  <div id="grid" class="grid grid-cols-[repeat(auto-fill,minmax(260px,1fr))] gap-4"></div>
</main>

<div id="playerBar"
     class="player-hidden fixed bottom-4 left-4 right-4 z-50 mx-auto flex max-w-[960px] items-center gap-3 rounded-3xl border border-gray-200 bg-white/90 px-4 py-2.5 shadow-[0_-8px_32px_rgba(0,0,0,0.12)] backdrop-blur-xl transition-all duration-300 dark:border-zinc-800 dark:bg-zinc-900/90">

  <div id="pArt"
       class="relative flex h-12 w-12 flex-none items-center justify-center overflow-hidden rounded-xl bg-gray-100 text-lg font-bold text-gray-500 dark:bg-zinc-800 dark:text-zinc-400"></div>

  <div class="min-w-0 flex-1">
    <div id="pName" class="truncate text-sm font-semibold"></div>
    <div id="pStatus" class="truncate text-xs text-gray-500 dark:text-zinc-400"></div>
  </div>

  <div class="hidden flex-none items-center gap-2 text-gray-500 sm:flex dark:text-zinc-400">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5L6 9H2v6h4l5 4V5z"/>
      <path d="M15.54 8.46a5 5 0 010 7.07"/>
    </svg>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"
           class="h-1 w-[90px] cursor-pointer accent-slate-900 dark:accent-white">
  </div>

  <div class="flex flex-none items-center gap-3">
    <button id="pFavBtn" type="button"
            data-i18n-title="toggleFav" title="Toggle Favorite" aria-label="Toggle Favorite"
            class="flex h-9 w-9 flex-none items-center justify-center rounded-full text-gray-500 transition-colors hover:bg-gray-100 dark:text-zinc-400 dark:hover:bg-zinc-800">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
      </svg>
    </button>

    <button id="pPlayBtn" type="button" aria-label="Play/Pause"
            class="flex h-11 w-11 flex-none items-center justify-center rounded-full bg-slate-900 text-white transition-opacity hover:opacity-90 dark:bg-white dark:text-zinc-950">
      <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="6 3 20 12 6 21 6 3"/>
      </svg>
      <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <rect x="14" y="4" width="4" height="16" rx="1"/>
        <rect x="6" y="4" width="4" height="16" rx="1"/>
      </svg>
    </button>
  </div>
</div>

<dialog id="customDlg"
        class="m-auto w-[min(440px,92vw)] rounded-3xl border border-gray-200 bg-white p-7 text-gray-900 shadow-2xl outline-none dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-50">
  <form id="customForm" method="dialog">
    <h3 class="mb-4 text-xl font-bold tracking-tight" data-i18n="dlgTitle">Add Custom Station</h3>

    <div class="mb-3.5">
      <label class="mb-1.5 block text-xs font-semibold text-gray-500 dark:text-zinc-400"
             data-i18n="lblName">Station Name *</label>
      <input name="name" required maxlength="60"
             data-i18n-placeholder="phName" placeholder="Enter station name"
             class="h-10 w-full rounded-xl border border-gray-200 bg-gray-50 px-3.5 text-sm outline-none transition-colors placeholder:text-gray-400 focus:border-slate-900 dark:border-zinc-800 dark:bg-zinc-950 dark:placeholder:text-zinc-500 dark:focus:border-white">
    </div>

    <div class="mb-3.5">
      <label class="mb-1.5 block text-xs font-semibold text-gray-500 dark:text-zinc-400"
             data-i18n="lblUrl">Stream URL *</label>
      <input name="url" type="url" required
             data-i18n-placeholder="phUrl" placeholder="Enter stream URL"
             class="h-10 w-full rounded-xl border border-gray-200 bg-gray-50 px-3.5 text-sm outline-none transition-colors placeholder:text-gray-400 focus:border-slate-900 dark:border-zinc-800 dark:bg-zinc-950 dark:placeholder:text-zinc-500 dark:focus:border-white">
    </div>

    <div class="mb-3.5">
      <label class="mb-1.5 block text-xs font-semibold text-gray-500 dark:text-zinc-400"
             data-i18n="lblGenre">Genre</label>
      <div class="relative">
        <select name="tags" id="dlgGenre"
                class="h-10 w-full appearance-none rounded-xl border border-gray-200 bg-gray-50 pl-3.5 pr-9 text-sm outline-none transition-colors focus:border-slate-900 dark:border-zinc-800 dark:bg-zinc-950 dark:focus:border-white"></select>
        <svg class="pointer-events-none absolute right-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-gray-400 dark:text-zinc-500"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 9l-7 7-7-7"/>
        </svg>
      </div>
    </div>

    <div class="mb-3.5">
      <label class="mb-1.5 block text-xs font-semibold text-gray-500 dark:text-zinc-400"
             data-i18n="lblLogo">Logo / Favicon URL</label>
      <input name="logo" type="url"
             data-i18n-placeholder="phLogo" placeholder="Enter logo URL"
             class="h-10 w-full rounded-xl border border-gray-200 bg-gray-50 px-3.5 text-sm outline-none transition-colors placeholder:text-gray-400 focus:border-slate-900 dark:border-zinc-800 dark:bg-zinc-950 dark:placeholder:text-zinc-500 dark:focus:border-white">
    </div>

    <div id="formErr" class="mt-2 min-h-[18px] text-[13px] text-red-500"></div>

    <div class="mt-6 flex justify-end gap-2.5">
      <button type="button" id="cancelDlg" data-i18n="cancel"
              class="inline-flex h-[42px] items-center justify-center rounded-full border border-gray-200 bg-gray-100 px-5 text-sm font-semibold text-gray-900 transition-colors hover:bg-gray-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-50 dark:hover:bg-zinc-700">Cancel</button>
      <button type="submit" data-i18n="save"
              class="inline-flex h-[42px] items-center justify-center rounded-full bg-slate-900 px-5 text-sm font-semibold text-white transition-opacity hover:opacity-90 dark:bg-white dark:text-zinc-950">Save Station</button>
    </div>
  </form>
</dialog>
</body>
</html>
